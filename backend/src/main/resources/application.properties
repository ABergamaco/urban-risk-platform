spring.application.name=urban-risk-backend

# ===== Banco H2 em arquivo (os dados ficam salvos em ./data) =====
spring.datasource.url=jdbc:h2:file:./data/urbanrisk
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.jpa.open-in-view=false

# ===== Urban Risk: configuracoes da plataforma =====
# Sensores simulados: geram uma leitura a cada 15 s
urbanrisk.simulador.ativo=true
urbanrisk.simulador.intervalo-ms=15000

# Base publica: API gratuita Open-Meteo (dados reais de clima), consultada a cada 10 min
urbanrisk.openmeteo.ativo=true
urbanrisk.openmeteo.url=https://api.open-meteo.com/v1/forecast
urbanrisk.openmeteo.intervalo-ms=600000

# Alerta de sensor sem dados novos ha mais de X minutos = desatualizado (confianca cai)
urbanrisk.sensor.limite-desatualizado-min=10

# Leituras brutas mais antigas que isso sao apagadas (os eventos continuam no historico)
urbanrisk.leituras.retencao-horas=24

# Codigo exigido para cadastrar um usuario com perfil AGENTE
urbanrisk.agente.codigo=DEFESA2026
